[project]
name = "smart-erp-wms-backend"
version = "0.1.0"
description = "智能 ERP 仓管系统后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.19,<2",
  "pymysql>=1.2,<2",
  "pydantic-settings>=2.15,<3",
  "PyJWT>=2.13,<3",
  "redis>=5,<6",
  "langgraph>=0.2,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]

